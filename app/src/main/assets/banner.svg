<!-- Google Play Feature Graphic (1024 x 500). Save as feature-graphic.svg and export to PNG (1024x500). -->
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F1ECFF"/>
            <stop offset="100%" stop-color="#CDBFFF"/>
        </linearGradient>

        <radialGradient id="bgHi" cx="32%" cy="18%" r="78%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>

        <!-- Rainbow arc -->
        <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF2D2D"/>
            <stop offset="16%" stop-color="#FF2BD6"/>
            <stop offset="33%" stop-color="#6A3CFF"/>
            <stop offset="50%" stop-color="#00C7FF"/>
            <stop offset="66%" stop-color="#00FF9A"/>
            <stop offset="83%" stop-color="#C8FF2E"/>
            <stop offset="100%" stop-color="#FFD12E"/>
        </linearGradient>

        <!-- Dropper ink -->
        <linearGradient id="dropperInk" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5D5AA6"/>
            <stop offset="100%" stop-color="#2B2A4E"/>
        </linearGradient>

        <linearGradient id="dropperHi" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
        </linearGradient>

        <!-- Shadows -->
        <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B0B1A" flood-opacity="0.22"/>
        </filter>

        <filter id="arcSoft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="0.7"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1024" height="500" fill="url(#bg)"/>
    <rect width="1024" height="500" fill="url(#bgHi)"/>

    <!-- Soft blob accent behind mark (subtle) -->
    <g opacity="0.16" filter="url(#shadow)">
        <path d="M240,110 C340,55 470,70 560,150 C650,230 640,350 540,400 C440,450 300,420 220,330 C140,240 140,165 240,110 Z"
            fill="#FFFFFF"/>
    </g>

    <!-- Brand mark block (left) -->
    <g transform="translate(300 250)">
        <!-- Arc -->
        <path d="M 0,-140 A 140,140 0 1,1 -100,100"
            fill="none"
            stroke="url(#rainbow)"
            stroke-width="40"
            stroke-linecap="round"
            filter="url(#arcSoft)"
            transform="rotate(35)"
            opacity="0.95"/>

        <!-- Dropper -->
        <g transform="rotate(-28) translate(-30,-36)" filter="url(#shadow)">
            <!-- Body -->
            <path d="M48,0 L24,0 C11,0 0,11 0,24 L0,62 L34,96 L68,62 L68,24 C68,11 57,0 48,0 Z"
                fill="url(#dropperInk)"/>
            <!-- Highlight -->
            <path d="M16,22 C16,14 22,10 30,10 L38,10 C46,10 52,14 52,22 L52,30 C52,32 50,34 48,34 L20,34 C18,34 16,32 16,30 Z"
                fill="url(#dropperHi)"/>
            <!-- Cap -->
            <path d="M24,0 L24,-16 C24,-22 44,-22 44,-16 L44,0 Z"
                fill="url(#dropperInk)" opacity="0.92"/>
            <!-- Stem -->
            <path d="M34,96 L34,120"
                stroke="url(#dropperInk)" stroke-width="8" stroke-linecap="round" opacity="0.20"/>
        </g>
    </g>

    <!-- Text block (right) -->
    <g transform="translate(560 190)">
        <text x="0" y="0"
            font-family="Inter, Roboto, Arial, sans-serif"
            font-size="44"
            font-weight="700"
            fill="#2B2A4E">
            Color Picker: Peek &amp; Capture
        </text>

        <text x="0" y="54"
            font-family="Inter, Roboto, Arial, sans-serif"
            font-size="24"
            font-weight="500"
            fill="#2B2A4E"
            opacity="0.78">
            Capture colors. Build palettes.
        </text>

        <!-- Small feature chips (optional, subtle, still safe for Play) -->
        <g transform="translate(0 96)" opacity="0.90">
            <g>
                <rect x="0" y="0" rx="16" ry="16" width="152" height="36" fill="#FFFFFF" opacity="0.65"/>
                <text x="16" y="24" font-family="Inter, Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B2A4E">
                    Camera pick
                </text>
            </g>
            <g transform="translate(168 0)">
                <rect x="0" y="0" rx="16" ry="16" width="136" height="36" fill="#FFFFFF" opacity="0.65"/>
                <text x="16" y="24" font-family="Inter, Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B2A4E">
                    Color names
                </text>
            </g>
            <g transform="translate(320 0)">
                <rect x="0" y="0" rx="16" ry="16" width="122" height="36" fill="#FFFFFF" opacity="0.65"/>
                <text x="16" y="24" font-family="Inter, Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B2A4E">
                    Palettes
                </text>
            </g>
        </g>
    </g>
</svg>
