<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
            <stop offset="20%" style="stop-color:#ff00ff;stop-opacity:1" />
            <stop offset="40%" style="stop-color:#0000ff;stop-opacity:1" />
            <stop offset="60%" style="stop-color:#00ffff;stop-opacity:1" />
            <stop offset="80%" style="stop-color:#00ff00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="dropperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
        </linearGradient>

        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="tightBlur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="tightBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="#050505" rx="40" />

    <g transform="translate(256, 256)">

        <circle r="180" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.2"
            stroke-dasharray="2 26" />

        <path d="M 0,-110 A 110,110 0 1,1 -80,80" fill="none" stroke="url(#rainbowGrad)"
            stroke-width="25" stroke-linecap="round" filter="url(#neonGlow)"
            transform="rotate(60)" />

        <g transform="rotate(-45) translate(-30, -30)">
            <path d="M40,0 L20,0 C9,0 0,9 0,20 L0,50 L30,80 L60,50 L60,20 C60,9 51,0 40,0 Z"
                fill="url(#dropperGrad)" filter="url(#neonGlow)" />
            <path d="M20,0 L20,-15 C20,-20 40,-20 40,-15 L40,0 Z" fill="#ffffff" opacity="0.9" />
            <path d="M30,80 L30,95" stroke="url(#dropperGrad)" stroke-width="6"
                stroke-linecap="round" />
        </g>
    </g>
</svg>