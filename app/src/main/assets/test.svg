<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Lavender background that plays nice with rainbow -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F1ECFF" />
            <stop offset="100%" stop-color="#CDBFFF" />
        </linearGradient>

        <!-- Subtle top highlight (quiet depth) -->
        <radialGradient id="bgHi" cx="40%" cy="25%" r="75%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>

        <!-- Smooth chroma spectrum (kept) -->
        <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF2D2D" />
            <stop offset="16%" stop-color="#FF2BD6" />
            <stop offset="33%" stop-color="#6A3CFF" />
            <stop offset="50%" stop-color="#00C7FF" />
            <stop offset="66%" stop-color="#00FF9A" />
            <stop offset="83%" stop-color="#C8FF2E" />
            <stop offset="100%" stop-color="#FFD12E" />
        </linearGradient>


        <linearGradient id="dropperInk" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5D5AA6" />
            <stop offset="100%" stop-color="#2B2A4E" />
        </linearGradient>

        <linearGradient id="dropperHi" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10" />
        </linearGradient>


        <!-- Clean shadow (less muddy) -->
        <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B0B1A"
                flood-opacity="0.26" />
        </filter>

        <!-- Very subtle arc softening (NOT a glow) -->
        <filter id="arcSoft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="0.6" />
        </filter>
    </defs>

    <!-- Rounded app icon background -->
    <rect width="512" height="512" rx="96" fill="url(#bg)" />
    <rect width="512" height="512" rx="96" fill="url(#bgHi)" />

    <g transform="translate(256 256)">
        <!-- Chroma spectrum arc (kept, simplified) -->
        <path d="M 0,-156 A 156,156 0 1,1 -112,112" fill="none" stroke="url(#rainbow)"
            stroke-width="44" stroke-linecap="round" filter="url(#arcSoft)" transform="rotate(35)"
            opacity="0.95" />

        <!-- Optional: thin crisp edge for readability at small sizes -->


        <!-- Dropper (kept, higher contrast, less detail) -->
        <g transform="rotate(-28) translate(-34,-40)" filter="url(#shadow)">
            <!-- Body -->
            <path d="M48,0 L24,0 C11,0 0,11 0,24 L0,62 L34,96 L68,62 L68,24 C68,11 57,0 48,0 Z"
                fill="url(#dropperInk)" />
            <!-- Soft highlight strip -->
            <path
                d="M16,22 C16,14 22,10 30,10 L38,10 C46,10 52,14 52,22 L52,30 C52,32 50,34 48,34 L20,34 C18,34 16,32 16,30 Z"
                fill="url(#dropperHi)" />
            <!-- Cap -->
            <path d="M24,0 L24,-16 C24,-22 44,-22 44,-16 L44,0 Z" fill="url(#dropperInk)"
                opacity="0.92" />

            <!-- Stem + droplet (kept but simpler) -->
            <path d="M34,96 L34,118" stroke="url(#dropperInk)" stroke-width="8"
                stroke-linecap="round" opacity="0.20" />

        </g>


    </g>
</svg>
